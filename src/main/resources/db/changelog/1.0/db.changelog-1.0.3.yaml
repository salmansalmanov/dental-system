databaseChangeLog:
  - changeSet:
      id: 1.0.3-create-appointments-table
      author: salmansalmanov
      changes:
        - createTable:
            tableName: appointments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: patient_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: doctor_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: treatment
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: payed_amount
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: unpaid_amount
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: appointments
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            constraintName: fk_appointments_id_patient_id
        - addForeignKeyConstraint:
            baseTableName: appointments
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
            constraintName: fk_appointments_id_doctor_id