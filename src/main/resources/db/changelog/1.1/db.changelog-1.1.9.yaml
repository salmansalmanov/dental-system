databaseChangeLog:
  - changeSet:
      id: 1.1.9-create-xray-sessions-table
      author: salmansalmanov
      changes:
        - createTable:
            tableName: xray_sessions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: appointment_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: xray_sessions
            baseColumnNames: appointment_id
            referencedTableName: appointments
            referencedColumnNames: id
            constraintName: fk_xray_sessions_appointment_id
            onDelete: CASCADE
        - createIndex:
            tableName: xray_sessions
            indexName: idx_xray_sessions_appointment_id
            columns:
              - column:
                  name: appointment_id
        - createIndex:
            tableName: xray_sessions
            indexName: idx_xray_sessions_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: xray_sessions
            indexName: idx_xray_sessions_expires_at
            columns:
              - column:
                  name: expires_at
