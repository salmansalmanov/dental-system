version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dental-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dental-net

  backend:
    build:
      context: ./dental-system
    container_name: dental-backend
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_FILE_STORAGE_PATH: /app/uploads/xray-images
    ports:
      - "8080:8080"
    volumes:
      - /var/www/dental-system/uploads/xray-images:/app/uploads/xray-images
    networks:
      - dental-net

  frontend:
    build:
      context: "./dental management frontend"
    container_name: dental-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dental-net

volumes:
  postgres_data:

networks:
  dental-net:
    driver: bridge