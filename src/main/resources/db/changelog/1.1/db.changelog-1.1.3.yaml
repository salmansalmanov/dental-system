databaseChangeLog:
  - changeSet:
      id: 1.1.3-add-price-and-paid-amount-to-appointments
      author: salmansalmanov
      changes:
        - addColumn:
            tableName: appointments
            columns:
              - column:
                  name: price
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: paid_amount
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false